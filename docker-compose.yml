services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: meeting_intelligence
      POSTGRES_USER: meeting
      POSTGRES_PASSWORD: meeting
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meeting -d meeting_intelligence"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./apps/api
    environment:
      APP_ENV: development
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+psycopg://meeting:meeting@postgres:5432/meeting_intelligence
      REDIS_URL: redis://redis:6379/0
      STORAGE_PROVIDER: local
      STORAGE_PATH: /data
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ./apps/api
    environment:
      APP_ENV: development
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+psycopg://meeting:meeting@postgres:5432/meeting_intelligence
      REDIS_URL: redis://redis:6379/0
      STORAGE_PROVIDER: local
      STORAGE_PATH: /data
    volumes:
      - ./apps/api:/app
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python -m app.worker

  web:
    build:
      context: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      - api
    command: npm run dev

volumes:
  postgres_data:
  web_node_modules:
